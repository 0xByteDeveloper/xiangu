<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xiangu Universal — Analiz Kasası</title>
<style>
:root{--bg:#0b1020;--bg2:#0e1630;--panel:#111a35;--panel2:#0d152b;--ink:#dce6ff;
--muted:#8fa2c8;--acc:#37d5d0;--acc2:#7c9bff;--warn:#ffcf6b;--ok:#43d6a3;
--line:#1c2b55;--chip:#16224a;--mono:'Cascadia Mono','JetBrains Mono',Consolas,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#152352 0%,var(--bg) 55%);
color:var(--ink);font:15px/1.55 'Segoe UI',system-ui,Arial,sans-serif}
#app{display:grid;grid-template-columns:330px 1fr;height:100vh}
/* ---------- sol bar ---------- */
#side{background:linear-gradient(180deg,var(--panel),var(--panel2));border-right:1px solid var(--line);
display:flex;flex-direction:column;min-height:0}
#brand{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
#brand h1{font-size:19px;letter-spacing:.4px;background:linear-gradient(90deg,var(--acc),var(--acc2));
-webkit-background-clip:text;background-clip:text;color:transparent}
#brand small{color:var(--muted);display:block;margin-top:4px;font-size:11.5px}
#searchwrap{padding:14px 16px 8px}
#search{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:10px;
color:var(--ink);padding:10px 34px 10px 12px;font-size:13.5px;outline:none;transition:.2s}
#search:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(55,213,208,.15)}
#scount{color:var(--muted);font-size:11px;padding:6px 18px 0;min-height:18px}
#doclist{flex:1;overflow:auto;padding:10px 12px}
.doc{padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;
transition:.15s}
.doc:hover{background:var(--chip)}
.doc.on{background:linear-gradient(90deg,rgba(55,213,208,.12),rgba(124,155,255,.08));border-color:var(--acc)}
.doc .t{font-weight:600;font-size:13.5px}
.doc .d{color:var(--muted);font-size:11.5px;margin-top:3px}
.doc .m{color:var(--acc);font-size:11px;margin-top:4px;font-family:var(--mono)}
#sidefoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
#sidefoot button{flex:1;background:var(--chip);color:var(--muted);border:1px solid var(--line);
border-radius:9px;padding:8px 6px;font-size:11.5px;cursor:pointer;transition:.15s}
#sidefoot button:hover{color:var(--ink);border-color:var(--acc)}
/* ---------- sağ ---------- */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);
background:rgba(13,21,43,.7);backdrop-filter:blur(6px)}
#topbar .crumb{font-size:13px;color:var(--muted)}
#topbar .crumb b{color:var(--ink)}
#topbar .sp{flex:1}
#topbar button{background:var(--chip);border:1px solid var(--line);color:var(--muted);border-radius:9px;
padding:7px 13px;font-size:12px;cursor:pointer}
#topbar button.on{color:var(--acc);border-color:var(--acc)}
#content{flex:1;overflow:auto;padding:22px 30px 60px;scroll-behavior:smooth}
/* ---------- doküman render ---------- */
.docview{display:none}
.docview.on{display:block}
.sec{margin:0 0 26px}
.sechead{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sechead .ln{color:var(--acc);font-family:var(--mono);font-size:11px}
.sechead h2{font-size:16.5px;letter-spacing:.3px;color:#fff}
.secbody{border-left:2px solid var(--line);margin:10px 0 0 8px;padding:8px 0 8px 16px}
.sec.folded .secbody{display:none}
pre{font-family:var(--mono);font-size:12.6px;line-height:1.62;white-space:pre-wrap;word-break:break-word;
color:var(--ink)}
.secbody pre em{color:var(--warn);font-style:normal;font-weight:600}
.wl{color:var(--acc);background:rgba(55,213,208,.09);border:1px solid rgba(55,213,208,.35);
border-radius:6px;padding:0 5px;cursor:pointer;font-size:.95em;transition:.12s}
.wl:hover{background:rgba(55,213,208,.22)}
.wl.flash{outline:2px solid var(--warn)}
/* ---------- arama kipi ---------- */
#hits{display:none}
#hits.on{display:block}
.hit{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;background:var(--panel2);cursor:pointer}
.hit .h{color:var(--muted);font-size:11.5px;margin-bottom:4px}
.hit .t{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
.hit mark{background:rgba(255,207,107,.3);color:var(--warn);border-radius:3px}
/* ---------- graf ---------- */
#graphwrap{display:none}
#graphwrap.on{display:block}
#gwrap{position:sticky;top:0}
#svg{width:100%;height:calc(100vh - 150px);background:var(--panel2);border:1px solid var(--line);border-radius:14px}
#ghint{color:var(--muted);font-size:12px;margin-top:8px}
.gnode{cursor:pointer}
.gnode circle{fill:#16224a;stroke:var(--acc2);stroke-width:1.4}
.gnode.hub circle{stroke:var(--acc);stroke-width:2.4;fill:#123a4d}
.gnode text{fill:var(--muted);font-size:9.5px;text-anchor:middle;pointer-events:none}
.gnode:hover circle{stroke:var(--warn)}
.glink{stroke:#2a3d78;stroke-width:1;opacity:.55}
.glink.hi{stroke:var(--acc);opacity:1;stroke-width:2}
/* ---------- durum ---------- */
#toast{position:fixed;bottom:18px;right:18px;background:var(--panel);border:1px solid var(--acc);
color:var(--ink);border-radius:10px;padding:10px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}
::selection{background:rgba(55,213,208,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1b2a55;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#284087}
@media print{#side,#topbar{display:none}#app{display:block}#content{overflow:visible}
.docview{display:block!important}.sec.folded .secbody{display:block!important}}
@media (max-width:900px){#app{grid-template-columns:1fr}#side{position:fixed;left:-330px;z-index:20;height:100vh;transition:.25s}
#side.open{left:0}#burger{display:inline-block!important}}
#burger{display:none}
</style>
</head>

      <h1>Xiangu Universal — Analiz Kasası</h1>

const DATA = {"docs": [{"file": "01_ozellik_haritasi.txt", "title": "01 · Özellik Haritası", "desc": "Kaynak ağacın tam özellik envanteri (düzeltme+ekleme)", "raw": "================================================================================\n XIANGU UNIVERSAL — 01 · ÖZELLİK HARİTASI (FEATURE MAP)\n================================================================================\n Hedef          : universalObfusPublicSrc.zip (içerik: vmp/ ağacı — VMProtect\n                  3.x tabanlı \"universalObfuscator\" kaynak kodu)\n Kaynak         : github.com/0xByteDeveloper/xiangu :: universalObfusPublicSrc.zip\n                  (21.182.531 bayt, 1.451 dosya, kök klasör: vmp/)\n Temel belge    : tum_ozellikler_hafif_arastirma.txt (kullanıcının hafif\n                  araştırması — BU BELGE onun düzeltilmiş + genişletilmiş hali)\n Doğrulama yönt.: 4 paralel derin kod incelemesi (core 116.565 satır, runtime\n                  ~12.000 satır, GUI/console/help, utils/shellext/tools) +\n                  dosya:satır referanslı teyitler. Teyit edilmeyen maddeler\n                  [HELP] etiketiyle işaretlendi (help/en dokümanından).\n Sürüm kimliği  : core/version.h = 1.0.0.0 (fork, standart 3.8.x değil!)\n                  Core::copyright = \"Copyright 2003-2021 VMProtect Software\"\n Not            : \"DÜZELTME\" etiketi, temel belgedeki hatalı/eksik bilgiyi\n                  gösterir. Ayrıntılı düzeltme sicili: 05_bulgular_duzeltmeler.txt\n================================================================================\n\n================================================================================\n 0. AĞACIN KİMLİĞİ VE KAPSAM (temel belgeye İLK EK)\n================================================================================\n Temel belge bu ağacı \"VMProtect\" olarak tarif ediyordu. Gerçek durum:\n - Ağaç, VMProtect 3.x ailesinin (3.4–3.8 dönemi) resmi kaynak dağıtımı\n   görünümünde bir FORK'tur; sürüm numarası 1.0.0.0'a sıfırlanmıştır\n   (core/version.h: 6 satır). Bu nedenle temel belgedeki \"3.8.x sürüm\n   geçmişi/history\" maddeleri bu ağaç için doğrudan okunamaz.\n - EDITION'lar vcxproj konfigürasyonlarıyla tanımlı: Lite / Professional /\n   Ultimate (+ Demo, Debug, Checked) — core.h:428-434 (\"VMProtect \" EDITION).\n - Fork'a özgü davranış yamaları (bkz. Bölüm U — \"Bu Ağaca Özgü Farklar\"):\n   * rand_seed=0 sabitlenmiş (DÜZELTME: üretim DETERMİNİSTİK),\n   * VM giriş kapısı obfuscation motoru if(false) ile ölü bırakılmış,\n   * OpcodeCryptor tipi ccXor'a sabitlenmiş,\n   * cpCryptValues + cpEncryptRegs bitleri ÖLÜ (uygulanmamış),\n   * Çince (pinyin) yorum kalıntıları mevcut.\n - Toplam ölçek: 1.449 dosya / ~1.130.000 satır kaynak / 113 MB açılmış\n   boyut (XProtect worklog ölçümü; bu oturumda ağaç yapısıyla teyit).\n - README'de söz edilen build.sh / build.bat AĞAÇTA YOK; gerçek derleme\n   vmprotect.sln (MSVC) veya lin_*.mak / mac_*.mak (GNU make) iledir.\n\n================================================================================\n A. ÜRÜN / SÜRÜM / PLATFORM MATRİSİ\n================================================================================\n\nA1. Ürün kimlikleri (VMProtectProductId — core.h:377-426, 25 üye, TAM liste)\n--------------------------------------------------------------------------------\n KOD                          DEĞER   ANLAM\n VPI_NOT_SPECIFIED            0       tanımsız\n VPI_LITE_WIN_PERSONAL        1       Lite · Windows · Kişisel\n VPI_LITE_WIN_COMPANY         2       Lite · Windows · Şirket\n VPI_PROF_WIN_PERSONAL        3       Professional · Windows · Kişisel\n VPI_PROF_WIN_COMPANY         4       Professional · Windows · Şirket\n VPI_ULTM_WIN_PERSONAL        5       Ultimate · Windows · Kişisel\n VPI_ULTM_WIN_COMPANY         6       Ultimate · Windows · Şirket\n VPI_LITE_OSX_PERSONAL        7       Lite · macOS · Kişisel\n VPI_LITE_OSX_COMPANY         8       Lite · macOS · Şirket\n VPI_PROF_OSX_PERSONAL        9       Professional · macOS · Kişisel\n VPI_PROF_OSX_COMPANY        10       Professional · macOS · Şirket\n VPI_ULTM_OSX_PERSONAL       11       Ultimate · macOS · Kişisel\n VPI_ULTM_OSX_COMPANY        12       Ultimate · macOS · Şirket\n VPI_WLM_PERSONAL            13       Web License Manager · Kişisel\n VPI_WLM_COMPANY             14       Web License Manager · Şirket\n VPI_YEAR_PESONAL            15       Yıllık lisans · Kişisel (typo kaynakta)\n VPI_YEAR_COMPANY            16       Yıllık lisans · Şirket\n VPI_SENS_WIN_PERSONAL       17       Sensitized · Windows · Kişisel\n VPI_SENS_WIN_COMPANY        18       Sensitized · Windows · Şirket\n VPI_LITE_LIN_PERSONAL       19       Lite · Linux · Kişisel\n VPI_LITE_LIN_COMPANY        20       Lite · Linux · Şirket\n VPI_PROF_LIN_PERSONAL       21       Professional · Linux · Kişisel\n VPI_PROF_LIN_COMPANY        22       Professional · Linux · Şirket\n VPI_ULTM_LIN_PERSONAL       23       Ultimate · Linux · Kişisel\n VPI_ULTM_LIN_COMPANY        24       Ultimate · Linux · Şirket\n Kontrol: Core::check_license_edition (core.cc:1988) lisans bUserData[0]\n ile karşılaştırır. Temel belgedeki liste doğruydu; platform eş takma\n adları (#ifdef __unix__/__APPLE__) eklendi.\n\nA2. Özellik kapıları (Lite/Professional/Ultimate) [HELP — yardım dokümanı]\n--------------------------------------------------------------------------------\n Özellik                        Lite    Professional   Ultimate\n Mutation                        VAR         VAR          VAR\n Virtualization                  VAR         VAR          VAR\n Ultra (M+V)                     VAR         VAR          VAR\n Memory/Import/Resource prot.    VAR         VAR          VAR\n Packing (LZMA)                  VAR         VAR          VAR\n Debugger + VM detection         VAR         VAR          VAR\n Console (VMProtectCon)          YOK         VAR          VAR\n Watermark                       YOK         VAR          VAR\n Script (Lua+FFI)                YOK         VAR          VAR\n Licensing sistemi               YOK         YOK          VAR\n License Manager                 YOK         YOK          VAR\n Virtual Files / File prot.      YOK         YOK          VAR\n Ek: Demo konfigürasyonu (vcxproj) → NAG + cpUnregisteredVersion yolu;\n     Checked konfigürasyon → aşama aşama hash doğrulama print'leri.\n\nA3. Desteklenen işletim sistemleri / formatlar (kaynak doğrulamalı)\n--------------------------------------------------------------------------------\n - Windows PE 32/64: pefile.cc (6.124 satır) — EXE/DLL/SYS sürücü;\n   PEArchitecture x86+AMD64; sürücü runtime blob'ları win_runtime32/64.sys.\n   [HELP] Win2000+ iddiası yardım dokümanından; loader'daki hardcoded\n   syscall tablosu XP(2600)→Win10 22H2(19045) build'lerini kapsar (bkz. D1).\n   Not: Win11 build'leri (22000/22621) syscall TABLOSUNDA ayrı dal değil;\n   bilinmeyen build'de loader ntdll'nin ikinci bir kopyasını NtCreateSection\n   ile eşleyip syscall numaralarını elle okur (loader.cc:996-1023).\n - macOS Mach-O 32/64: macfile.cc (6.714 satır) + FAT/universal ikili\n   (fat_header, FAT_CIGAM) + objc.cc entegrasyonu; mac_runtime32/64.dylib blob.\n - Linux ELF 32/64: elffile.cc (5.513 satır); ET_EXEC/ET_DYN; Verneed/Verdef\n   sürüm tabloları; .eh_frame + DWARF; lin_runtime32/64.so blob.\n - .NET: dotnetfile.cc (12.425 satır) + il.cc (7.840 satır); net20/net40/\n   netcore/netstandard gömülü runtime DLL'leri (core/*.dll + *.inc bloblar);\n   BAML (WPF) string taraması; ObfuscationAttribute desteği.\n - Cross-protect: aynı Windows araç dosyası Mach-O/ELF üretebilir (tüm\n   format motorları aynı core içinde).\n - Sürücü koruması: VMProtectDDK + win_runtime*.sys (PEIntelLoader sürücü\n   yolu: driver_object->DriverUnload, NON_PAGED_POOL_NX vb. FACE sabitleri).\n\nA4. Desteklenen derleyiciler / diller (derleyici imza taramasıyla — files.h:1036-1051)\n--------------------------------------------------------------------------------\n cfBaseRegistr / cfGetBaseRegistr : MSVC x86 temel yazmaç kalıbı\n cfCxxSEH, cfCxxSEH3, cfCxxSEH4    : MSVC C++ SEH aileleri\n cfSEH4Prolog                      : SEH4 prolog\n cfVB6SEH, cfDllFunctionCall       : VB6 (DllFunctionCall imzası)\n cfInitBCBSEH, cfBCBSEH            : Borland C++ Builder SEH\n cfRelocatorMinGW                  : MinGW relocator (PERelocation::ParseMinGW)\n cfPatchImport                     : Delphi6 TlsAlloc yaması\n (Ayrıca MAP çözümü: MSVC/GCC/GCC-Apple/Delphi — unit-tests MapFunctionListTest)\n\nA5. UI dilleri\n--------------------------------------------------------------------------------\n langs/en.lng, ru.lng, zh.lng, fr.lng (INI biçimi) + core/lang.bat üretim\n zinciri (lang_def.inc / lang_enum.inc / lang_info.inc). Çalışma anında\n LanguageManager yürütülebilir yanındaki langs/*.lng'yi tarar. Temel belge\n doğruydu. GUI çatısı Qt 5.6 (lin_gui.mak: Qt5Core/Gui/Widgets/Help).\n\n================================================================================\n B. KOD KORUMA MOTORU (core/)\n================================================================================\n\nB1. Derleme tipleri (CompilationType — files.h:308-313)\n--------------------------------------------------------------------------------\n ctVirtualization : native komutlar → gömülü VM bayt kodu\n ctMutation       : komut seviyesi obfuscation (native kalır)\n ctUltra          : önce mutation, sonra virtualization\n ctNone = 0xFF    : korumasız\n Sevk noktası: IntelFunction::Compile (intel.cc:18434-18452). Kaynakta\n Çince yorum kalıntıları: \"//bian yi\" (ctMutation), \"//xu ni hua\"\n (ctVirtualization), \"//xu ni hua + bian yi\" (ctUltra).\n\nB2. Mutasyon (IntelFunction::Mutate — intel.cc:16039-16561)\n--------------------------------------------------------------------------------\n - ~70 ölü-kod şablonu: mov reg,reg / mov reg,imm / movsx-movzx / not-neg-\n   inc-dec / cmp-test / and-or-xor-add-adc-sub-sbb / shl-shr-sal-sar-rol-\n   ror-rcl-rcr / bt-bts-btr-btc / setXX / cmov / clc-stc-cmc / cbw-cwde-\n   cwd-cdq-cdqe-cqo / lahf / bswap / xchg / xadd / jmp rel32 ...\n - rastgele işlenen maskeleri (osRandom/osRandomStartWord, regFree(0xf),\n   flRandom(0xff)) + GetCommandInfo/GetFreeRegisters ile ölü yazmaç-bayrak\n   analizi; her araya \"rand()%4\" adet çöp komut.\n - ön dönüşümler: kısa jmp→uzun; JCXZ/LOOP → push+jmp blok yapısına açma;\n   call $+5 kalıplarının push/lea/xchg ile değişimi.\n - komut içi eşdeğerler: xor r,r → sub r,r; add reg,x → lea [reg+x];\n   sub → lea [reg-x]; native modda jmp imm → push imm; ret.\n - DÜZELTME (önemli): IntelObfuscation (stack/yazmaç/bayrak simülasyonlu\n   agresif parçalama motoru, intel.cc:17252-18130) bu forkta ÇAĞRILMAZ —\n   IntelFunction::AddGate içindeki çağrı \"if(false)\" ile ölü (intel.cc:18149).\n\nB3. Virtualization (intel.cc — 577 komut tipi destekli)\n--------------------------------------------------------------------------------\n - Gömülü VM yorumlayıcı; harici DLL yok; runtime blob imaja eklenir.\n - DÜZELTME + EK: İKİ VM MİMARİSİ (VirtualMachineType, intel.h:1471-1474):\n   * vtClassic : 1-bayt opcode + 0x100 girişli itab (switch/jump table),\n   * vtAdvanced: opcode baytı YOK; komutlar göreli 32-bit ofset zinciriyle\n     bağlı; her opcode için 10 handler klonu (CloneHandler).\n   Seçim: kayıtsız sürüm/vm_flags&1 → Classic; kayıtlı → Advanced.\n - DÜZELTME + EK: VM SAYISI — kayıtsız ya da vm_flags&2 → 1 VM; kayıtlı\n   sürüm → 10 FARKLI VM (core.cc:1745-1751), her CommandBlock rastgele\n   bir VM'e atanır (BaseFunction::virtual_machine, processors.cc:2215-2228).\n   \"Her build'de komut seti değişebilir\" maddesi böyle gerçekleşir:\n   her VM kendi opcode sırasını Fisher-Yates ile karıştırır.\n - cpEncryptBytecode: OpcodeCryptor + ValueCryptor zincirleri; her handler\n   kendi kodunu çalışma anında çözer (AddReadCommand, intel.cc:27806-27822);\n   bayt kodu iki geçişli şifrelenir (IntelVirtualMachine::CompileBlock).\n - VM yazmaç modeli: 16 GP yazmaç (x64 R8-R15 dahil) + regEFX/regETX/\n   regERX/regEIX sözde-yazmaçları (processors.h:58-65); VM context ayrı\n   yığında (x64: esp-128-context*8, 16-bayt hizalı).\n - DÜZELTME (önemli): cpEncryptRegs ve cpCryptValues bu ağaçta ÖLÜ\n   bitlerdir — tanımlıdır (cpMaximumProtection bileşimi) ama hiçbir .cc\n   kullanmaz. Şifreleme yüzeyi: cpEncryptBytecode + link şifreleme\n   (CommandLink::Encrypt) + gate entry_cryptor + cmXadd session-key\n   blokları (bkz. B5/B10).\n\nB4. Ultra\n--------------------------------------------------------------------------------\n ctUltra = Mutate(ctx, true) + CompileToVM; en yüksek anti-analiz.\n\nB5. Seri anahtarına kilitleme (code lock — ULTIMATE)\n--------------------------------------------------------------------------------\n - Marker: VMProtectBeginVirtualizationLockByKey / BeginUltraLockByKey\n   (sdk.h) — ioLockToKey (files.h:282-294) + CompilationOption coLockToKey\n   (processors.h:632-634).\n - Mekanik: cmXadd'li değer, loader'dan VAR_SESSION_KEY ile 4 dword'lük\n   bloklar hâlinde EncryptBuffer ile şifreli gömülür; çalışma anında\n   atDecryptBuffer SDK çağrısıyla çözülür (intel.cc:8744-8834).\n   Geçersiz seride VM komutları çözülemez → fonksiyon çalışmaz.\n\nB6. Koruma nesne tipleri (ObjectType — files.h:739-749)\n--------------------------------------------------------------------------------\n otCode, otData, otExport, otMarker, otAPIMarker, otImport, otString,\n otUnknown(ek).\n\nB7. Marker API'leri (sdk/VMProtectSDK.h — 23 export)\n--------------------------------------------------------------------------------\n VMProtectBegin / BeginVirtualization / BeginMutation / BeginUltra /\n BeginVirtualizationLockByKey / BeginUltraLockByKey / VMProtectEnd.\n - Fonksiyon seçimi: MAP dosyası (MapFile::Parse; MSVC/GCC/Delphi), PDB\n   (pdb.h — MSF/CodeView, GUID doğrulamalı), COFF sembol tablosu.\n - Klasör bazında toplu CompilationType + \"Excluded From Compilation\".\n - [HELP] Minimum korunacak prosedür boyutu 5 bayt (faq.htm'de belgeli).\n - External address işaretleme (ExtCommandList) + End-of-function ile\ OC]]\n└─ KATMAN 2 · Süreç:             [[50 Port Süreci MOC]]\n\nGraf özeti (not sayısı): 38 not · 4 MOC ailesi · ~120 wikilink\n                              + 12 kavram etiketi (#tag)\n\n────────────────────────────────────────────────────────────────────────────────\n NOT: [[00 Xiangu Universal MOC]]  (KÖK MOC)\n────────────────────────────────────────────────────────────────────────────────\n---\naliases: [Xiangu Universal, Ana Harita, Vault Kökü]\ntype: moc\nlayer: 0\ntags: [#moc, #xiangu-universal]\n---\n Kasa girişi. Aşağıdaki 5 alt MOC'u sırayla dolaşarak tüm yapı zinciri\n okunabilir:\n\n - [[10 vmp Kaynak Ağacı MOC]] — universalObfusPublicSrc'nin iç yapısı\n - [[20 XProtect Projesi MOC]] — port hedefinin iç yapısı\n - [[30 Koruma Kavramları MOC]] — iki tarafı birleştiren kavram düğümleri\n - [[40 Analiz ve Doğrulama MOC]] — düzeltmeler, kanıtlar, ölçümler\n - [[50 Port Süreci MOC]] — 0.1.0 → 0.8.4 gelişim zinciri\n\nBAĞLANTILAR (backlink): (kök — geri bağlantı yok)\n\n================================================================================\n 10 · VMP KAYNAK AĞACI MOC  — [[10 vmp Kaynak Ağacı MOC]]\n================================================================================\n---\naliases: [universalObfuscator Ağacı, vmp Tree]\ntype: moc\nlayer: 1\nsource: universalObfusPublicSrc.zip → vmp/ (1.449 dosya, ~1.13M satır)\ntags: [#kaynak, #vmprotect, #moc]\n---\n Alt notlar:\n\n KATMAN-NOTLARI\n ├── [[11 Ürün Katmanı]]            (sürüm/edition/lisans kimlikleri)\n ├── [[12 Koruma Motoru]]           (core/ — V·M·U üretim çekirdeği)\n ├── [[13 Runtime Katmanı]]         (loader, manager'lar, crypto)\n ├── [[14 Dosya Formatı Motorları]]  (PE/ELF/Mach-O/.NET/ObjC/DWARF/PDB)\n ├── [[15 SDK Yüzeyi]]              (native/DDK/.NET/Delphi/VB)\n ├── [[16 GUI]]                     (Qt 5.6 — pencere/menü/diyalog)\n ├── [[17 Console]]                 (VMProtectCon CLI)\n ├── [[18 Script Motoru]]           (Lua 5.4 + FFI, 5 olay kancası)\n ├── [[19 Yardımcı Araçl ommandLink::Encrypt; entry_cryptor;\n   cmXadd session-key blokları ([[G3 Code Lock]] ile birleşir)\n İlişki: [[13 Runtime Katmanı]]'na runtime_options (ro*) sinyalleri gönderir;\n    [[14 Dosya Formatı Motorları]] üzerinden PE/ELF/Mach-O/.NET'e iner.\n\nBAĞLANTILAR: [[10 vmp Kaynak Ağacı MOC]], [[121 Virtualization Ünitesi]], [[122 Mutasyon Ünitesi]],\n             [[123 Packer Ünitesi]], [[13 Runtime Katmanı]], [[30 Koruma Kavramları MOC]]\n\n────────────────────────────────────────────────────────────────────────────────\n NOT: [[121 Virtualization Ünitesi]]\n────────────────────────────────────────────────────────────────────────────────\n---\naliases: [VM Ünitesi]\ntype: alt-bileşen\nfiles: intel.cc:27744-30976 (IntelVirtualMachine::Init/InitCommands/CompileBlock)\ntags: [#virtualization, #vm, #itab]\n---\n - VM sayısı: kayıtlı 10 / kayıtsız 1; her CommandBlock RASTGELE VM'e.\n - vtClassic: 1-bayt opcode + 0x100 itab (jump table, ltCase).\n - vtAdvanced: opcode yok; rel32 ofset zinciri + her opcode 10 klon.\n - Yazmaç modeli: 16 GP + regEFX/ETX/ERX/EIX; VM context ayrı yığın.\n - cpEncryptBytecode: handler kendi kodunu çalışma anında çözer; dump iki\n   geçişli şifreli.\n - Fork notu: OpcodeCryptor tipi ccXor SABİT (processors.cc:777-779).\n Paralel not (port tarafı): [[X21 MiniVM Çekirdeği]] — aynı kavramın\n freestanding C gerçeklemesi. Karşılaştırma: [[41 Port Oranı Ölçümü]].\n\nBAĞLANTILAR: [[12 Koruma Motoru]], [[X21 MiniVM Çekirdeği]], [[G1 Sanallaştırma]], [[41 Port Oranı Ölçümü]]\n\n────────────────────────────────────────────────────────────────────────────────\n NOT: [[122 Mutasyon Ünitesi]]\n────────────────────────────────────────────────────────────────────────────────\n---\naliases: [Mutation Ünitesi]\ntype: alt-bileşen\nfiles: intel.cc:16039-16561 (IntelFunction::Mutate)\ntags: [#mutation, #obfuscation]\n---\n ~70 çöp-komut şablonu + eşdeğer ikameler (xor→sub, add→lea, jmp→push+ret)\n + JCXZ/LOOP açılımı. Paralel not: [[X22 Mutasyon Çekirdeği]] ( le": "04_XProtect_port_analizi.txt", "title": "04 · XProtect Port Analizi", "desc": "Fark listesi · port oranı · yapı farkı", "raw": "================================================================================\n XIANGU UNIVERSAL — 04 · XPROTECT PORT ANALİZİ\n (universalObfusPublicSrc ↔ XProtect 0.8.4 — fark listesi, port oranı,\n  yapı farkı, karşılaştırma sistemi)\n================================================================================\n KAYNAKLAR\n  A (kaynak)   : universalObfusPublicSrc.zip → vmp/ (1.449 dosya, ~1.130.477\n                 satır, 113 MB) — VMProtect 3.x tabanlı fork, version 1.0.0.0\n  B (port)     : XProtect_0.8.4.zip → XProtectUI.exe/32 + source/ + kanit/\n                 + kanit_084/ (girdi-zincir ~17.172 satır el yazımı + blob'lar\n                 + LZMA SDK 5.710; toplam paket 8,5 MB)\n  C (kullanıcı hedefi beyanı): \"universalObfusPublicSrc'den portlayarak\n                 yaptım; amaç FULL C++ olması ve VS2019 C++'da derlenebilme;\n                 fakat TAM PORTLAYAMADIM — aradaki fark ve port oranını,\n                 yapı farkını listeleyebilecek bir sistem istiyorum.\"\n  D (kendi ölçümü, worklog.md): M1 ~%1,7 · M2 ~%9 (v2.0-r %20,5) · M3\n                 fonksiyonel sanallaştırma yolu %65 · UI ~%90+\n Bu belge o \"sistemin\" çıktısıdır: ölçüm yöntemleri (§5) + güncel ölçüm\n (§6) + tam fark cetveli (§7) + yapı karşılık haritası (§2) + yapısal\n farklılıklar (§3) + eksik envanteri (§8) + yol haritası (§9).\n\n================================================================================\n 1. KİMLİK KARŞILAŞTIRMASI\n================================================================================\n                        vmp (kaynak)                        XProtect 0.8.4 (port)\n Dil/çatı           C++ + Qt 5.6 (GUI) + Lua + C#           C++17 (saf Win32 GUI)\n                                                          + freestanding C (VM/XRT)\n Derleyici          MSVC (sln) / g++ (mak)                 zig cc/c++ → mingw-w64\n                                                          (x86_64/x86-windows-gnu)\n Derleme ortamı     Windows + Qt + invariant statik kütü.  Linux çapraz derleme\n                     (lua/lzma/ffi/scintilla/tinyxml...)    (gcc -ffreestanding\n                                                          blob zinciri + zig)\n Çıktı              VMProtect.exe/.Con/.Con.Tests + SDK     XProtectUI.exe (x64) +\n + runtime DLL'leri  dll'eri + runtime blob .inc            XProtectUI32.exe (x86)\n                     (runtime.vmp ile üretilmiş)            + gömülü VM/XRT blob\n Formatlar          PE + Mach-O + ELF + .NET               YALNIZ PE32/PE32+\n Mimari sayısı      x86+x64+NET (çok mimarili aynı dosya)   x64 + x86 (iki exe,\n                                                          aynı kaynak)\n Sürüm              1.0.0.0 fork                            0.8.4 (2026-11-09)\n\n================================================================================\n 2. BİLEŞEN KARŞILIK HARİTASI (yapı zinciri — doküman 02 ile eş dinli)\n================================================================================\n vmp BİLEŞENİ                      XPROTECT KARŞILIĞI            TAŞIMA DURUMU\n core/core.cc (Core::Open/Compile) engine_main.cpp::protect()      YENİDEN TASARIM\n core/intel.cc (derleyici+VM)      engine_disasm + engine_lift      KISMİ (alt küme)\n                                   (31.493 satır)      (876 satır)  ~%3 komut yüzeyi\n core/processors.cc (şifreleyiciler) vm_opcodes.h VM_KS/VM_KSC +     FARKLI ALGORİTMA\n                                   xr_cipher.h CFB-64\n core/intel.cc IntelVirtualMachine  vm_core.c MiniVM                KAVRAM AKTARIMI\n runtime/loader.cc (SetupImage)    xrt_core.c xrt_entry             DARALTILMIŞ\n runtime/core.cc (Exported*)        xrt_license.c lic_sdk_core       KISMİ (37 fnid)\n runtime/licensing_manager.cc       xrt_license.c lic_parse_serial  BİRBİR (format)\n runtime/crypto.cc (RC5/SHA1/RSA)   SHA-1 birebir; R =====================================================\n 3. YAPISAL FARKLILIKLAR (tasarım felsefesi)\n================================================================================\n 3.1 BÜTÜNLÜK: vmp tek çekirdek + çok format; XProtect \"motor + İKİ\n     freestanding blob (VM, XRT) + UI\" üç parçalı — blob'lar -fno-jump-\n     tables/-fno-stack-protector ile PIC, libc'siz.\n 3.2 DERLENMİŞLİK: vmp MSVC/Qt zinciri (Windows makinada); XProtect Linux'ta\n     çapraz: gcc blob → ld -Ttext=0x100000 → objcopy -O binary → python\n     gen_*_blob.py → C++ dizi → zig link. \"VS2019'da derlenebilme\" hedefi\n     için not: mevcut kaynak saf Win32 + C++17 olduğundan MSVC'ye taşınması\n     düşük engelli görünür; blob'lar zaten önceden üretilmiş veri olarak\n     commitlenmiştir (vm_blob.cpp/xrt_blob.cpp) — MSVC tarafında da aynı\n     veri dizileri bağlanabilir; gereken şey proje dosyası (.vcxproj)\n     üretimidir.\n 3.3 VM FELSEFESİ: vmp — handler üretimi C++ ile derleme zamanında,\n     itab switch/case, 10 farklı VM, opcode cryptor zincirleri;\n     XProtect — 43 opcode tek yorumlayıcı, if/else zinciri (PIC şartı),\n     polimorfik itab FNV tohumlu Fisher-Yates (tablo taşınmaz),\n     CFB bayt-kodu (tek-bayt tamper yayılımı) + adım bütçesi 1<<24.\n 3.4 ANTI-DEBUG FELSEFESİ: vmp — geniş yüzey (20+ sinyal, kernel mod dahil);\n     XProtect — istisna-dispatch'siz 2 kesin-kanıt kontrolü (K1/K2) +\n     bilinçli yok-liste (oyun DRx/int3-hook/AV-VEH yanlış-pozitifleri).\n 3.5 STRING MODELİ: vmp orijinali şifreleyip yazar; XProtect şifreli ÖZEL\n     KOPYA .vmp0'da üretir, orijinale dokunmaz (native/M referansları\n     güvende).\n 3.6 SEH: vmp .pdata'yi derlemede yeniden üretir; XProtect RtlAddFunction-\n     Table ile ÇALIŞMA ANINDA dinamik kayıt (JIT modeli — dd[3]'e dokunmaz).\n 3.7 KANIT KÜLTÜRÜ: vmp gtest xtest seti; XProtect diferansiyel koşular\n     (Unicorn orijinal↔korumalı), wine RCODE matrisi, statik çözümleyici\n     (static_ad_check.py — çıktı EXE'den bytecode'u let curDoc = 0, folded = {};
const $ = s => document.querySelector(s);

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderText(raw){
  // wikilink -> çip; DÜZELTME/TEYİT/Not vurgusu
  let t = esc(raw);
  t = t.replace(/\[\[([^\[\]]+)\]\]/g, (m,n)=>'<span class="wl" data-target="'+n+'">'+n+'</span>');
  t = t.replace(/(DÜZELTME[^\n]*?)/g,'<em>$1</em>');
  return t;
}

function buildAll(){
  // doküman sekmeleri
  const dl = $('#doclist'); dl.innerHTML='';
  DATA.docs.forEach((d,i)=>{
    const el = document.createElement('div');
    el.className='doc'+(i===0?' on':'');
    el.innerHTML='<div class="t">'+d.title+'</div><div class="d">'+d.desc+
      '</div><div class="m">'+d.file+' · '+d.raw.split('\n').length+' satır · '+
      d.sections.length+' bölüm</div>';
    el.onclick=()=>showDoc(i);
    dl.appendChild(el);
  });
  // içerik
  const c = $('#content');
  c.innerHTML='<div id="hits"></div><div id="graphwrap"></div>'+
    DATA.docs.map((d,i)=>'<div class="docview" id="dv'+i+'"></div>').join('');
  DATA.docs.forEach((d,i)=>{
    const dv = $('#dv'+i);
    d.sections.forEach((s,si)=>{
      const lines = d.raw.split('\n');
      const next = si+1 < d.sections.length ? d.sections[si+1].line : lines.length;
      const body = lines.slice(s.line, next).join('\n');
      const sec = document.createElement('div');
      sec.className='sec'; sec.id='d'+i+'s'+si;
      sec.innerHTML='<div class="sechead" onclick="this.parentElement.classList.toggle(\'folded\')">'+
        '<span class="ln">'+String(si+1).padStart(2,'0')+'</span><h2>'+esc(s.title)+'</h2></div>'+
        '<div class="secbody"><pre>'+renderText(body)+'</pre></div>';
      dv.appendChild(sec);
    });
  });
  buildGraph();
}

function showDoc(i){
  curDoc=i;
  document.querySelectorAll('.doc').forEach((e,j)=>e.classList.toggle('on',j===i));
  document.querySelectorAll('.docview').forEach((e,j)=>{e.classList.toggle('on',j===i);e.style.display='';});
  $('#hits').classList.remove('on');
  $('#graphwrap').classList.remove('on');
  const d=DATA.docs[i];
  $('#crumbdoc').textContent=d.title;
  $('#crumbfile').textContent=d.file;
  $('#content').scrollTop=0;
}

/* ---- wikilink gezinme ---- */
function jumpTo(target){
  const norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
  const nt=norm(target);
  // 1) bölüm başlığı eşleşmesi
  for(let i=0;i<DATA.docs.length;i++){
    for(let si=0;si<DATA.docs[i].sections.length;si++){
      if(norm(DATA.docs[i].sections[si].title)===nt){
        showDoc(i); const e=document.getElementById('d'+i+'s'+si);
        e.scrollIntoView({behavior:'smooth',block:'start'});
        e.classList.remove('folded'); flash(e); toast(DATA.docs[i].sections[si].title); return;
      }
    }
  }
  // 2) metin içinde ara
  const mIdx=DATA.docs.map(d=>d.raw.toLowerCase().indexOf(nt)).map(x=>x<0?1e9:x);
  const i=mIdx.indexOf(Math.min(...mIdx));
  if(mIdx[i]<1e9){
    showDoc(i);
    const secs=DATA.docs[i].sections;
    let best=0,pos=mIdx[i];
    for(let k=0;k<secs.length;k++){const L=DATA.docs[i].raw.toLowerCase().lastIndexOf('\n',pos-0);
      if(secs[k].line*1<=pos)best=k;}
    const e=document.getElementById('d'+i+'s'+best);
    if(e){e.classList.remove('folded');e.scrollIntoView({behavior:'smooth'});flash(e);}
    toast('"'+target+'" — 02 kasasındaki not (metin içi)');
  }
}
function flash(e){e.style.transition='none';e.style.background='rgba(255,207,107,.15)';
  setTimeout(()=>{e.style.transition='background 1.2s';e.style.background='transparent'},400);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);
  t._x=setTimeout(()=>t.classList.remove('on'),1800);}

document.addEventListener('click',e=>{
  const wl=e.target.closest('.wl');
  if(wl){jumpTo(wl.dataset.target);return;}
  const hit=e.target.closest('.hit');
  if(hit){showDoc(+hit.dataset.doc);
    const el=document.getElementById('d'+hit.dataset.doc+'s'+hit.dataset.sec);
    if(el){el.classList.remove('folded');el.scrollIntoView({behavior:'smooth'});flash(el);}
    $('#hits').classList.remove('on');document.querySelectorAll('.docview').forEach(x=>{});
    return;}
});

/* ---- arama ---- */
let sto=null;
$('#search').addEventListener('input',e=>{
  clearTimeout(sto); sto=setTimeout(()=>doSearch(e.target.value.trim()),240);
});
function doSearch(q){
  const H=$('#hits');
  if(q.length<2){H.classList.remove('on');document.querySelectorAll('.docview').forEach((x,i)=>x.classList.toggle('on',i===curDoc));return;}
  const ql=q.toLowerCase(); let total=0; H.innerHTML='';
  DATA.docs.forEach((d,i)=>{
    const lines=d.raw.split('\n');
    lines.forEach((ln,li)=>{
      const L=ln.toLowerCase();
      if(L.includes(ql) && ln.trim()!==''){
        total++;
        // bölüm bul
        let sec=0; d.sections.forEach((s,k)=>{if(s.line<=li)sec=k;});
        const m=esc(ln).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\&')+')','ig'),'<mark>$1</mark>');
        const hit=document.createElement('div');hit.className='hit';
        hit.dataset.doc=i;hit.dataset.sec=sec;
        hit.innerHTML='<div class="h">'+d.title+' · bölüm '+(sec+1)+' · satır '+(li+1)+'</div><div class="t">'+m+'</div>';
        H.appendChild(hit);
      }
    });
  });
  document.querySelectorAll('.docview').forEach(x=>x.classList.remove('on'));
  H.classList.add('on');
  $('#scount').textContent=total+' eşleşme'+(total===200?' (ilk 200)':'')+' — "'+q+'"';
}

/* ---- graf ---- */
function buildGraph(){
  const g=DATA.graph, W=1160;
  const layers={};
  g.nodes.forEach(n=>{(layers[n.layer]=layers[n.layer]||[]).push(n);});
  const H=Math.max(360, 90+Object.keys(layers).length*95);
  let pos={};
  Object.keys(layers).sort((a,b)=>a-b).forEach(k=>{
    const arr=layers[k]; const y=60+ (+k)*95;
    arr.forEach((n,i)=>{
      const x= 70 + i*( (W-140)/Math.max(1,arr.length-1) ) + (arr.length===1?(W-140)/2:0);
      pos[n.id]=[x,y];
    });
  });
  let svg='<svg id="svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  const id2n={}; g.nodes.forEach(n=>id2n[n.id]=n);
  g.links.forEach(l=>{
    const a=pos[l[0]],b=pos[l[1]];
    if(a&&b) svg+='<line class="glink" data-a="'+l[0]+'" data-b="'+l[1]+'" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>';
  });
  const maxN=Math.max(1,...g.nodes.map(n=>n.n));
  g.nodes.forEach(n=>{
    const p=pos[n.id]; if(!p)return;
    const r=5+9*(n.n/maxN);
    svg+='<g class="gnode'+(n.n>=3?' hub':'')+'" data-id="'+n.id+'">'+
      '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'"/>'+
      '<text x="'+p[0]+'" y="'+(p[1]+r+11)+'">'+(n.id.length>26?n.id.slice(0,25)+'…':n.id)+'</text></g>';
  });
  svg+='</svg>';
  $('#graphwrap').innerHTML='<div id="gwrap">'+svg+'</div>'+
    '<div id="ghint">MOC yapı zinciri grafı — düğümler [[not]] bağlantı sayısına göre büyür (yeşil=hub). Düğüme tıkla → ilgili bölüme atla. '+
    g.nodes.length+' not · '+g.links.length+' wikilink.</div>';
  $('#graphwrap').ondblclick=e=>{
    const gn=e.target.closest('.gnode');
    if(gn){jumpTo(gn.dataset.id);}
  };
  $('#graphwrap').onclick=e=>{
    const gn=e.target.closest('.gnode');
    if(gn){
      document.querySelectorAll('.glink').forEach(L=>{
        L.classList.toggle('hi', L.dataset.a===gn.dataset.id||L.dataset.b===gn.dataset.id);
      });
      toast(gn.dataset.id+' — '+ (id2n[gn.dataset.id]? id2n[gn.dataset.id].n:0) + ' bağlantı · çift tıkla: bölüme atla');
    }
  };
}
